<!-- marker-ar.html -->

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marker AR - Interactive Solar System</title>
    
    <link rel="stylesheet" href="styles.css">

    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="interactions.js" defer></script>
    
    <style> body { margin: 0; overflow: hidden; touch-action: none; } </style>
  </head>

  <body>
    <!-- ================================================================
         THE AR UI OVERLAY (Hidden until marker is detected)
         ================================================================ -->
    <div id="ar-ui-container" class="hidden">
      
      <!-- Top Control Bar (Visible in Solar System view) -->
      <div id="top-controls">
        <button id="btn-play-pause" class="ar-btn">⏸ Pause Orbits</button>
        <button id="btn-toggle-orbits" class="ar-btn">⭕ Show Paths</button>
        <button id="btn-toggle-bg" class="ar-btn">🌌 Background: OFF</button>
      </div>

      <!-- Planet Focus Panel (Bottom Half of Screen) -->
      <div id="focus-panel" class="hidden">
        <h2>🌍 Earth</h2>
        <p>Third planet from the Sun. The only known world to harbor life.<br><br><b>Gestures:</b> Swipe to rotate, Pinch to zoom.</p>
        <div class="focus-controls">
          <button id="btn-focus-spin" class="ar-btn">⏸ Pause Earth Spin</button>
        </div>
        <button id="btn-exit-focus" class="ar-btn danger-btn">← Back to Solar System</button>
      </div>

    </div>

    <!-- ================================================================
         THE 3D SCENE
         ================================================================ -->
    <a-scene
      mindar-image="imageTargetSrc: ./markers/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="sunModel" src="./models/sun.glb"></a-asset-item>
        <a-asset-item id="earthModel" src="./models/earth.glb"></a-asset-item>
        <a-asset-item id="moonModel" src="./models/moon.glb"></a-asset-item>
        <img id="spaceTexture" src="./markers/space.jpg">
      </a-assets>

      <!-- Raycaster for tapping the Earth model -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable"></a-camera>

      <a-light type="ambient" color="#cccccc" intensity="1"></a-light>
      <a-light type="point" position="0 0 0" color="#ffffff" intensity="2"></a-light>

      <!-- Target Entity tracking -->
      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        
        <!-- Space Background (Placed directly on the marker under the system) -->
        <a-image id="space-bg" src="#spaceTexture" position="0 0 0" rotation="0 0 0" width="3" height="3" visible="false"></a-image>

        <!-- ROOT: Touch gestures apply here. Rotated 90 on X so orbits lay flat -->
        <a-entity id="solar-system-root" rotation="90 0 0" scale="0.2 0.2 0.2">

          <!-- SUN -->
          <a-entity id="sun-wrapper" class="anim-target" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear; pauseEvents: pauseOrbit; resumeEvents: resumeOrbit">
            <a-gltf-model src="#sunModel"></a-gltf-model>
          </a-entity>

          <!-- EARTH ORBIT PATH (Using torus for perfect 3D visibility) -->
          <a-torus id="earth-path" class="orbit-path" radius="2" radius-tubular="0.015" color="#ffffff" opacity="0.6" rotation="90 0 0" visible="false"></a-torus>

          <!-- EARTH PIVOT -->
          <a-entity id="earth-pivot" class="anim-target" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear; pauseEvents: pauseOrbit; resumeEvents: resumeOrbit">
            
            <a-entity id="earth-container" position="2 0 0">
              
              <!-- EARTH MODEL (Clickable) -->
              <a-entity id="earth-spin" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear; pauseEvents: pauseSpin; resumeEvents: resumeSpin">
                <a-gltf-model id="earth-model" class="clickable" src="#earthModel" scale="0.4 0.4 0.4"></a-gltf-model>
              </a-entity>

              <!-- MOON ORBIT PATH -->
              <a-torus id="moon-path" class="orbit-path" radius="0.6" radius-tubular="0.01" color="#ffffff" opacity="0.6" rotation="90 0 0" visible="false"></a-torus>

              <!-- MOON PIVOT -->
              <a-entity id="moon-pivot" class="anim-target" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear; pauseEvents: pauseOrbit; resumeEvents: resumeOrbit">
                <a-gltf-model id="moon-model" src="#moonModel" position="0.6 0 0" scale="0.15 0.15 0.15"></a-gltf-model>
              </a-entity>

            </a-entity>
          </a-entity> 
          
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>

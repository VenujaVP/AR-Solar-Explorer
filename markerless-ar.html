<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markerless AR - Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: transparent; /* Ensures camera feed is visible */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    /* Dynamic AR Instruction Banner */
    #ar-instructions {
      position: fixed; 
      top: 40px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.85); 
      color: white;
      padding: 12px 24px; 
      border-radius: 30px; 
      font-weight: bold;
      border: 1px solid #4facfe;
      z-index: 1000; 
      pointer-events: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: none; /* Hidden until AR starts */
    }

    /* Keep the exit button clean */
    button { cursor: pointer; }
  </style>
</head>
<body>

  <!-- The UI that guides the user through the 7 steps -->
  <div id="ar-instructions">Start AR to begin</div>

  <!-- Import Three.js and WebXR ARButton as ES Modules -->
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.147.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.147.0/examples/jsm/webxr/ARButton.js';

    // === 1. SCENE SETUP ===
    const scene = new THREE.Scene();
    // No background! We need it transparent for the camera.
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    
    scene.add(new THREE.AmbientLight(0x404040, 2));

    // === 2. TRANSPARENT RENDERER ===
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true; // Enable WebXR
    document.body.appendChild(renderer.domElement);

    // === 3. START AR BUTTON ===
    const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
    document.body.appendChild(arButton);

    const instructions = document.getElementById("ar-instructions");
    arButton.addEventListener('click', () => {
        instructions.style.display = "block";
        instructions.innerText = "Scanning environment... Point camera at a table.";
    });

    // === 4. SOLAR SYSTEM SETUP (Esraa Codes integration) ===
    const solarSystem = new THREE.Group();
    solarSystem.visible = false; // Hidden until placed on the table
    scene.add(solarSystem);

    // Scale factor to shrink massive 3D distances down to fit on a physical table
    const SCALE = 0.015; 

    // Sun
    const sunTexture = new THREE.TextureLoader().load("textures/sun.jpg");
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(8 * SCALE, 32, 32),
      new THREE.MeshBasicMaterial({ map: sunTexture }) 
    );
    solarSystem.add(sun);
    
    const sunLight = new THREE.PointLight(0xffffff, 2, 5); 
    sunLight.castShadow = true;
    sun.add(sunLight);

    // Planet Generator Function
    function createPlanet(name, size, distance, speed, texturePath, cloudPath, moonTexture, ringTexture) {
      const texture = new THREE.TextureLoader().load(texturePath);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(size * SCALE, 32, 32),
        new THREE.MeshStandardMaterial({ map: texture })
      );
      
      const pivot = new THREE.Object3D();
      mesh.position.x = distance * SCALE;
      pivot.add(mesh);
      solarSystem.add(pivot);

      if (cloudPath) {
        const cloudTex = new THREE.TextureLoader().load(cloudPath);
        const cloudMesh = new THREE.Mesh(
          new THREE.SphereGeometry((size + 0.05) * SCALE, 32, 32),
          new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, opacity: 0.6 })
        );
        mesh.add(cloudMesh);
      }
      
      if (moonTexture) {
        const moonTex = new THREE.TextureLoader().load(moonTexture);
        const moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.8 * SCALE, 16, 16),
          new THREE.MeshStandardMaterial({ map: moonTex })
        );
        const moonPivot = new THREE.Object3D();
        moonMesh.position.x = (size + 2) * SCALE;
        moonPivot.add(moonMesh);
        mesh.add(moonPivot);
      }
      
      if (ringTexture) {
        const ringTex = new THREE.TextureLoader().load(ringTexture);
        const ring = new THREE.Mesh(
          new THREE.RingGeometry((size + 1) * SCALE, (size + 3) * SCALE, 32),
          new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true })
        );
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }
      
      return { mesh, pivot, speed };
    }

    // Build the planets
    const planets = [
      createPlanet("Mercury", 1.5, 12, 0.01, "textures/mercury.jpg"),
      createPlanet("Venus", 2, 18, 0.007, "textures/venus.jpg"),
      createPlanet("Earth", 2.5, 24, 0.005, "textures/earth.jpg", "textures/earth_clouds.jpg", "textures/moon.jpg"),
      createPlanet("Mars", 2, 30, 0.004, "textures/mars.jpg"),
      createPlanet("Jupiter", 4, 38, 0.003, "textures/jupiter.jpg"),
      createPlanet("Saturn", 3.5, 46, 0.002, "textures/saturn.jpg", null, null, "textures/saturn_ring.png"),
      createPlanet("Uranus", 3, 52, 0.0015, "textures/uranus.jpg"),
      createPlanet("Neptune", 3, 60, 0.001, "textures/neptune.jpg")
    ];

    // === 5. WEBXR HIT TESTING & PLACEMENT ===
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let isPlaced = false;

    // The targeting ring that appears on the table
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff00 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Tap Event: Place the Solar System
    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      if (reticle.visible && !isPlaced) {
        solarSystem.position.setFromMatrixPosition(reticle.matrix);
        solarSystem.visible = true; // Show the full system
        isPlaced = true;            // Lock placement
        reticle.visible = false;    // Hide the targeting ring
        instructions.innerText = "System Placed! Planets are now orbiting.";
        
        // Hide instructions completely after 4 seconds
        setTimeout(() => { instructions.style.display = 'none'; }, 4000);
      }
    });
    scene.add(controller);

    // === 6. RENDER & ANIMATION LOOP ===
    renderer.setAnimationLoop((timestamp, frame) => {
      
      // Handle WebXR Hit Testing (Scanning for the table)
      if (frame && !isPlaced) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((refSpace) => {
            session.requestHitTestSource({ space: refSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            
            // Step 4: Surface Detected
            instructions.innerText = "Surface detected. Tap to place Solar System.";
          } else {
            reticle.visible = false;
            instructions.innerText = "Scanning environment... Point camera at a table.";
          }
        }
      }

      // Step 7: Planets start orbiting
      if (isPlaced) {
        planets.forEach(p => {
          p.pivot.rotation.y += p.speed;
          p.mesh.rotation.y += 0.005; // Independent planet rotation
        });
      }

      renderer.render(scene, camera);
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

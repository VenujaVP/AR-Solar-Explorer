<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Model Test Viewer</title>
    <!-- We only need A-Frame for this, no MindAR -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  </head>
  <body>
    <!-- A basic scene with a light gray background -->
    <a-scene background="color: #ECECEC">
      
      <!-- 1. Load the model -->
      <a-assets>
        <!-- Change 'earth.glb' to whichever model you want to preview -->
        <a-asset-item id="testModel" src="./models/moon.glb"></a-asset-item>
      </a-assets>

      <!-- 2. Display the model -->
      <!-- position="x y z": x is left/right, y is up/down, z is forward/backward -->
      <!-- We use z="-3" to push the model 3 meters in front of the camera so you can see it -->
      <a-gltf-model src="#testModel" position="0 1.5 -3" scale="0.2 0.2 0.2" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"></a-gltf-model>

      <!-- 3. Standard web camera (Click and drag to look around) -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

    </a-scene>
  </body>
</html>
